[project]
name = "qdstar"
version = "0.3.8"
license = "GPL-3.0-or-later"
authors = [{ name = "Manuel Alcocer Jiménez (EA7KLX)" }]
readme = "README.md"
description = "IC-705 D-STAR Terminal Mode (internal gateway, WLAN) controller"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "certifi"]

[project.urls]
Homepage = "https://github.com/manuel-alcocer/qdstar"

[project.gui-scripts]
qdstar = "qdstar.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qdstar", "qdstar.dstar"]

[tool.setuptools.package-data]
qdstar = ["icon.svg", "fonts/*", "default_reflectors.json", "translations/*.po"]
