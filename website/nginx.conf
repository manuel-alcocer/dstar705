# Static QDStar website. nginx-unprivileged listens on 8080 as uid 101.
map $http_accept_language $prefers_spanish {
    default 0;
    "~^es"  1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Spanish-speaking browsers land on /es/ unless they asked for English (/?lang=en)
    location = / {
        set $to_spanish $prefers_spanish;
        if ($arg_lang) {
            set $to_spanish 0;
        }
        if ($to_spanish) {
            return 302 /es/;
        }
        try_files /index.html =404;
    }

    location /img/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
