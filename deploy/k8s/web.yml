# qdstar.alcocer.net: the static website (home page and manual, EN/ES).
#
# Public exposure: the Ingress uses the websecure-ext Traefik entrypoint, which
# the traefik-external LoadBalancer publishes. The public DNS record
# (qdstar.alcocer.net CNAME homeptr.alcocer.net) lives at he.net and is created
# by hand. Internal access: qdstar.k.alcocer.net.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdstar-web
  namespace: qdstar
  labels:
    app.kubernetes.io/name: qdstar-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qdstar-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdstar-web
    spec:
      securityContext:
        # nginx-unprivileged's own uid; it binds 8080 and needs no capabilities.
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/manuel-alcocer/qdstar-web:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: qdstar-web
---
apiVersion: v1
kind: Service
metadata:
  name: qdstar-web
  namespace: qdstar
spec:
  selector:
    app.kubernetes.io/name: qdstar-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qdstar-web
  namespace: qdstar
  annotations:
    cert-manager.io/cluster-issuer: clusterissuer-he
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,websecure-ext
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
    - host: qdstar.alcocer.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qdstar-web
                port:
                  number: 80
    - host: qdstar.k.alcocer.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qdstar-web
                port:
                  number: 80
  tls:
    - hosts:
        - qdstar.alcocer.net
        - qdstar.k.alcocer.net
      secretName: qdstar-web-tls
