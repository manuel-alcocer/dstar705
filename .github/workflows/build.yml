name: build

on:
  push:
    # semantic-release (.releaserc.json) numbers and publishes the versions from the
    # commit messages: dev -> x.y.z-beta.N, release/x.y.z -> x.y.z-rc.N, main -> x.y.z
    branches: [main, dev, "release/**"]
    # The website and its deployment have their own workflow (website.yml)
    paths-ignore: ["website/**", "deploy/**", "argocd/**", ".github/workflows/website.yml", ".github/workflows/release-*.yml"]
  pull_request:
    paths-ignore: ["website/**", "deploy/**", "argocd/**", ".github/workflows/website.yml", ".github/workflows/release-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a release must not overtake the one before it
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  SEMANTIC_RELEASE: >-
    -p semantic-release@25 -p @semantic-release/exec@7
    -p conventional-changelog-conventionalcommits@9

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # semantic-release checks that it may push, also in a dry run
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # semantic-release reads the tags and the commits since the last one
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Next version
        id: next
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Writes version=x.y.z to the step output when the commits call for a release
        run: npx --yes $SEMANTIC_RELEASE semantic-release --dry-run
      - id: v
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          if [ -n "$NEXT" ]; then
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Nothing to release: a build to try out, numbered after the last tag
            base=$(git describe --tags --abbrev=0 --match '[0-9]*')
            echo "version=${base}+dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # PySide6 6.9 x86_64 wheels need glibc >= 2.28
          - { runner: ubuntu-22.04, deb_arch: amd64, appimage_arch: x86_64, pyside: "6.9.3" }
          # PySide6 >= 6.8 aarch64 wheels need glibc 2.39; 6.7 runs on Raspberry Pi OS / Debian 12
          - { runner: ubuntu-22.04-arm, deb_arch: arm64, appimage_arch: aarch64, pyside: "6.7.3" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 fuse libfuse2 tcl8.6 tk8.6
      - name: Python dependencies
        run: pip install "PySide6==${{ matrix.pyside }}" certifi keyring pyinstaller
      - name: Version
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Translations complete
        run: python tools/i18n_check.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/qdstar.spec
      - name: Packages
        run: |
          V="${{ needs.version.outputs.version }}"
          packaging/build_deb.sh "$V" "${{ matrix.deb_arch }}"
          packaging/build_appimage.sh "$V" "${{ matrix.appimage_arch }}"
          tar -C dist -czf "dist/QDStar-${V}-linux-${{ matrix.deb_arch }}.tar.gz" qdstar
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.deb_arch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependencies
        run: pip install "PySide6==6.9.3" certifi keyring pyinstaller
      - name: Version
        run: python tools/set_version.py "${{ needs.version.outputs.version }}"
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/qdstar.spec
      - name: Installer and zip
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\qdstar.iss
          Compress-Archive -Path dist\qdstar -DestinationPath "dist\QDStar-$v-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Tag and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes $SEMANTIC_RELEASE semantic-release

  # After a public release: drop the releases it replaces and bring its tag into dev
  after-release:
    if: github.ref_name == 'main'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete replaced releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/prune_releases.py --delete
      - name: Merge main into dev
        # dev numbers its betas from the last public tag it contains
        run: |
          git ls-remote --exit-code --heads origin dev || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git merge --no-edit origin/main
          git push origin dev
