name: build

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
    # The website and its deployment have their own workflow (website.yml)
    paths-ignore: ["website/**", "deploy/**", "argocd/**", ".github/workflows/website.yml"]
  pull_request:
    paths-ignore: ["website/**", "deploy/**", "argocd/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' qdstar/__init__.py)
            echo "version=${base}~dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # PySide6 6.9 x86_64 wheels need glibc >= 2.28
          - { runner: ubuntu-22.04, deb_arch: amd64, appimage_arch: x86_64, pyside: "6.9.3" }
          # PySide6 >= 6.8 aarch64 wheels need glibc 2.39; 6.7 runs on Raspberry Pi OS / Debian 12
          - { runner: ubuntu-22.04-arm, deb_arch: arm64, appimage_arch: aarch64, pyside: "6.7.3" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 fuse libfuse2 tcl8.6 tk8.6
      - name: Python dependencies
        run: pip install "PySide6==${{ matrix.pyside }}" certifi pyinstaller
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Translations complete
        run: python tools/i18n_check.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/qdstar.spec
      - name: Packages
        run: |
          V="${{ needs.version.outputs.version }}"
          packaging/build_deb.sh "$V" "${{ matrix.deb_arch }}"
          packaging/build_appimage.sh "$V" "${{ matrix.appimage_arch }}"
          tar -C dist -czf "dist/QDStar-${V}-linux-${{ matrix.deb_arch }}.tar.gz" qdstar
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependencies
        run: pip install "PySide6==6.9.3" certifi pyinstaller
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/qdstar.spec
      - name: Installer and zip
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $numeric = ($v -split '~')[0]
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$numeric" packaging\qdstar.iss
          Compress-Archive -Path dist\qdstar -DestinationPath "dist\QDStar-$v-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: QDStar ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
